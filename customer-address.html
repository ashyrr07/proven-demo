<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<meta name="robots" content="noindex">
<title>Proven prototype: Address on the map</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#35204F}a:hover{color:#1E1030}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#F5F2F8;color:#35204F;font-family:Figtree,system-ui,sans-serif;font-size:15px;line-height:1.4}
.h{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.025em;line-height:1.04;margin:0}
.m{color:#5E5270}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 22px;box-sizing:border-box;border:0;border-radius:18px;font:700 17px Figtree,sans-serif;text-decoration:none}
.sun{background:#FFC233;color:#35204F;box-shadow:0 5px 0 #D99A0B}
.rnd{width:48px;height:48px;border-radius:50%;border:0;background:#fff;color:#35204F;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #CFC3DD}
.ring{position:absolute;left:195px;top:232px;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:rgba(75,42,122,.18);border:2px solid #4B2A7A;animation:ping 2.4s ease-out infinite}
.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13.5px}
.f input{height:52px;box-sizing:border-box;border-radius:16px;border:2px solid #DDD3E8;background:#fff;padding:0 16px;font:500 16px Figtree,sans-serif;color:#35204F}
@keyframes ping{0%{transform:scale(.4);opacity:.8}100%{transform:scale(2.4);opacity:0}}
@keyframes sheet{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<style>html{background:#1B0E2B}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}</style>
</head>
<body>
<div class="scr">
<div style="position: relative; height: 500px; flex-shrink: 0">
<svg width="390" height="500" viewBox="0 0 390 500" aria-hidden="true" style="display: block"><rect width="390" height="500" fill="#EAE3F1"/><g transform="rotate(-14 195 250)"><rect x="-120" y="-80" width="640" height="660" fill="#EAE3F1"/><rect x="228" y="92" width="120" height="118" rx="12" fill="#D5E6CC"/><rect x="-30" y="322" width="96" height="120" rx="12" fill="#DDD3E8"/><g stroke="#fff" stroke-width="15" stroke-linecap="round"><path d="M-120 78h640M-120 228h640M-120 392h640M-12-80v660M212-80v660M362-80v660"/></g><g stroke="#fff" stroke-width="7"><path d="M-120 150h640M-120 308h640M-120 470h640M96-80v660M288-80v660"/></g><path d="M-120 228h640" stroke="#FFE08A" stroke-width="10"/><g fill="#fff"><rect x="112" y="244" width="40" height="26" rx="5"/><rect x="160" y="244" width="40" height="26" rx="5"/><rect x="112" y="276" width="40" height="22" rx="5"/></g></g></svg>
<div class="ring"></div>
<div class="ring" style="animation-delay: 1.2s"></div>
<div style="position: absolute; left: 171px; top: 174px">
<svg width="48" height="62" viewBox="0 0 48 62" role="img" aria-label="Your location"><path d="M24 60S4 38 4 23a20 20 0 0 1 40 0c0 15-20 37-20 37z" fill="#4B2A7A" stroke="#fff" stroke-width="3"/><circle cx="24" cy="23" r="8.5" fill="#FFC233"/></svg>
</div>
<div style="position: absolute; left: 20px; right: 20px; top: 14px; display: flex; justify-content: space-between">
<a class="rnd" href="customer-location.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<button class="rnd" aria-label="Center on my location"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
</div>
<div style="position: absolute; left: 50%; top: 104px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; background: #35204F; color: #fff; font-weight: 600; font-size: 13.5px; white-space: nowrap">Drag the map to move the pin</div>
</div>
<div style="margin-top: -30px; position: relative; background: #fff; border-radius: 30px 30px 0 0; padding: 22px 24px 26px 24px; flex-grow: 1; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -8px 0 rgba(53, 32, 79, .08); animation: sheet .5s cubic-bezier(.2, .8, .2, 1) .15s both">
<div style="display: flex; justify-content: space-between; align-items: center"><span class="m" style="font-weight: 600; font-size: 13.5px">We found you here</span><span class="m" style="font-size: 13px; font-weight: 600">3 of 3</span></div>
<div>
<h1 class="h" style="font-size: 30px">4821 Elm Ridge Dr</h1>
<p class="m" style="margin: 4px 0 0 0; font-size: 16px">Dallas, TX 75204</p>
</div>
<label class="f">Apartment, suite or gate code (optional)<input type="text" placeholder="Gate code 2217"></label>
<a class="btn sun" href="customer-home.html" style="margin-top: auto">Confirm address</a>
</div>
</div>

</body>
</html>
