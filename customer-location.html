<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<meta name="robots" content="noindex">
<title>Proven prototype: Allow location</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#35204F}a:hover{color:#1E1030}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#F5F2F8;color:#35204F;font-family:Figtree,system-ui,sans-serif;font-size:15px;line-height:1.4}
.h{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.025em;line-height:1.04;margin:0}
.m{color:#5E5270}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 22px;box-sizing:border-box;border:0;border-radius:18px;font:700 17px Figtree,sans-serif;text-decoration:none}
.sun{background:#FFC233;color:#35204F;box-shadow:0 5px 0 #D99A0B}
.back{width:44px;height:44px;margin-left:-10px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#35204F}
.bar{flex:1;height:6px;border-radius:3px;background:#DDD3E8}
.bar.on{background:#35204F}
.ring{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;border:3px solid #4B2A7A;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.7}100%{transform:scale(2.5);opacity:0}}
@keyframes drop{0%{transform:translateY(-70px);opacity:0}70%{transform:translateY(6px);opacity:1}100%{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<style>html{background:#1B0E2B}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}</style>
</head>
<body>
<div class="scr">
<div style="padding: 10px 24px 0 24px; display: flex; flex-direction: column; gap: 18px; flex-grow: 1">
<div style="display: flex; align-items: center; gap: 10px">
<a class="back" href="customer-details.html" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<div style="display: flex; gap: 6px; flex-grow: 1" role="img" aria-label="Step 2 of 3"><div class="bar on"></div><div class="bar on"></div><div class="bar"></div></div>
<span class="m" style="font-size: 13px; font-weight: 600">2 of 3</span>
</div>
<div style="position: relative; width: 300px; height: 300px; align-self: center; border-radius: 50%; overflow: hidden; box-shadow: 0 10px 0 #DDD3E8">
<svg width="300" height="300" viewBox="0 0 300 300" aria-hidden="true" style="display: block"><rect width="300" height="300" fill="#EAE3F1"/><g transform="rotate(-14 150 150)"><rect x="40" y="170" width="100" height="90" rx="10" fill="#D5E6CC"/><g stroke="#fff" stroke-width="14" stroke-linecap="round"><path d="M-80 50h460M-80 160h460M-80 270h460M20-80v460M150-80v460M270-80v460"/></g><g stroke="#fff" stroke-width="6"><path d="M-80 105h460M-80 215h460M85-80v460M210-80v460"/></g><path d="M-80 160h460" stroke="#FFE08A" stroke-width="9"/></g></svg>
<div class="ring"></div>
<div class="ring" style="animation-delay: 1.2s"></div>
<div style="position: absolute; left: 50%; top: 50%; margin: -58px 0 0 -24px; animation: drop .7s cubic-bezier(.2, .9, .3, 1.1) .2s both">
<svg width="48" height="62" viewBox="0 0 48 62" aria-hidden="true"><path d="M24 60S4 38 4 23a20 20 0 0 1 40 0c0 15-20 37-20 37z" fill="#4B2A7A" stroke="#fff" stroke-width="3"/><circle cx="24" cy="23" r="8.5" fill="#FFC233"/></svg>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 class="h" style="font-size: 36px">Where should the pro come?</h1>
<p class="m" style="margin: 0; font-size: 16px">Allow location and we find your address for you. You can also type it in.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 12px; font-size: 15px">
<div style="display: flex; gap: 12px; align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#35204F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Used only to set the address for your jobs.</span></div>
<div style="display: flex; gap: 12px; align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#35204F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>A pro sees your exact address only after accepting your job.</span></div>
</div>
</div>
<div style="padding: 14px 24px 18px 24px; display: flex; flex-direction: column; gap: 6px; align-items: center">
<a class="btn sun" href="customer-address.html" style="align-self: stretch">Allow location</a>
<a href="customer-address.html" style="min-height: 44px; display: flex; align-items: center; font-weight: 600">Type my address instead</a>
</div>
</div>

</body>
</html>
