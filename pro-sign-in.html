<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<meta name="robots" content="noindex">
<title>Proven prototype: Pro app: sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFC233}a:hover{color:#FFD569}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#2A1740;color:#fff;font-family:Figtree,system-ui,sans-serif;font-size:15px;line-height:1.4}
.h{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.025em;line-height:1.04;margin:0}
.s{color:#DCCFEA}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 22px;box-sizing:border-box;border:0;border-radius:18px;font:700 17px Figtree,sans-serif;text-decoration:none}
.sun{background:#FFC233;color:#35204F;box-shadow:0 5px 0 #B77F00}
.btn.sun:hover{color:#35204F}
.coin{width:120px;height:120px;border-radius:50%;background:#FFC233;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #D99A0B,0 6px 0 #D99A0B,0 9px 0 #B77F00,0 12px 0 #B77F00,0 30px 34px -6px rgba(0,0,0,.55);animation:thunk .7s cubic-bezier(.2,.9,.3,1.2) .25s both}
@keyframes thunk{0%{transform:rotate(-34deg) scale(2.4);opacity:0}55%{transform:rotate(-9deg) scale(.9);opacity:1}100%{transform:rotate(-12deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<style>html{background:#1B0E2B}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}</style>
</head>
<body>
<div class="scr">
<div style="padding: 70px 24px 0 24px; display: flex; flex-direction: column; gap: 22px; flex-grow: 1">
<div class="coin">
<svg width="100" height="100" viewBox="0 0 108 108" role="img" aria-label="Proven seal"><defs><path id="arc" d="M18 54a36 36 0 0 1 72 0"/></defs><circle cx="54" cy="54" r="50" fill="none" stroke="#35204F" stroke-width="2.5"/><circle cx="54" cy="54" r="26" fill="#35204F"/><text font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="13.5" letter-spacing="4.5" fill="#35204F"><textPath href="#arc" startOffset="50%" text-anchor="middle">PROVEN</textPath></text><path d="M42 55l8.5 8.5L67 46" fill="none" stroke="#FFC233" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M34 86a40 40 0 0 0 40 0" fill="none" stroke="#35204F" stroke-width="2.5" stroke-linecap="round"/></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 14px">
<h1 class="h" style="font-size: 42px">Proven for pros</h1>
<p class="s" style="margin: 0; font-size: 16.5px">Sign in with the mobile number our team registered for you.</p>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-weight: 600; font-size: 14px">Mobile number
<input type="tel" value="+1 (469) 555-0117" autocomplete="tel" style="height: 58px; box-sizing: border-box; border-radius: 18px; border: 2px solid #6B4E91; background: #3A2257; padding: 0 18px; font: 600 19px Figtree, sans-serif; color: #fff">
</label>
<a class="btn sun" href="pro-new-job.html">Text me a sign-in code</a>
<div style="margin-top: auto; padding: 16px 18px; border-radius: 20px; background: #3A2257; font-size: 14px">
<div style="font-weight: 700">There is no sign-up in this app.</div>
<div class="s" style="margin-top: 4px">Proven creates your account after your drug screen, background check and insurance are confirmed. To join, call [YOUR US PHONE NUMBER].</div>
</div>
</div>
<div style="height: 26px"></div>
</div>

<script>
(function () {
  var box, timer;
  function toast(text) {
    if (!box) {
      box = document.createElement('div');
      box.setAttribute('role', 'status');
      box.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:320px;padding:12px 18px;border-radius:14px;background:#1B0E2B;color:#fff;font:600 14px Figtree,system-ui,sans-serif;text-align:center;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:opacity .2s';
      document.body.appendChild(box);
    }
    box.textContent = text;
    box.style.opacity = '1';
    clearTimeout(timer);
    timer = setTimeout(function () { box.style.opacity = '0'; }, 1800);
  }
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('a,button');
    if (!el || el.dataset.live) return;
    if (el.tagName === 'A') {
      var href = el.getAttribute('href') || '';
      if (href.charAt(0) !== '#') return;
      if (href.length > 1 && document.getElementById(href.slice(1))) return;
      ev.preventDefault();
    }
    toast('Not part of this prototype yet');
  });
})();
</script>
</body>
</html>
