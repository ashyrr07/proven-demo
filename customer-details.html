<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<meta name="robots" content="noindex">
<title>Proven prototype: Your details</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#35204F}a:hover{color:#1E1030}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#F5F2F8;color:#35204F;font-family:Figtree,system-ui,sans-serif;font-size:15px;line-height:1.4}
.h{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.025em;line-height:1.04;margin:0}
.m{color:#5E5270}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 22px;box-sizing:border-box;border:0;border-radius:18px;font:700 17px Figtree,sans-serif;text-decoration:none}
.sun{background:#FFC233;color:#35204F;box-shadow:0 5px 0 #D99A0B}
.back{width:44px;height:44px;margin-left:-10px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#35204F}
.bar{flex:1;height:6px;border-radius:3px;background:#DDD3E8}
.bar.on{background:#35204F}
.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13.5px}
.f input{height:54px;box-sizing:border-box;border-radius:16px;border:2px solid #DDD3E8;background:#fff;padding:0 16px;font:500 16.5px Figtree,sans-serif;color:#35204F}
.f input.now{border-color:#35204F;box-shadow:0 0 0 4px #FFE08A}
</style>
<style>html{background:#1B0E2B}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}</style>
</head>
<body>
<div class="scr">
<div style="padding: 10px 24px 0 24px; display: flex; flex-direction: column; gap: 18px; flex-grow: 1">
<div style="display: flex; align-items: center; gap: 10px">
<a class="back" href="customer-welcome.html" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<div style="display: flex; gap: 6px; flex-grow: 1" role="img" aria-label="Step 1 of 3"><div class="bar on"></div><div class="bar"></div><div class="bar"></div></div>
<span class="m" style="font-size: 13px; font-weight: 600">1 of 3</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 class="h" style="font-size: 36px">Tell us who you are</h1>
<p class="m" style="margin: 0; font-size: 16px">We filled in what Apple shared. Check it and add your mobile number.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label class="f">First name<input type="text" value="Jordan" autocomplete="given-name"></label>
<label class="f">Last name<input type="text" value="Taylor" autocomplete="family-name"></label>
</div>
<label class="f">Email<input type="email" value="jordan.taylor@icloud.com" autocomplete="email"></label>
<label class="f">Mobile phone<input class="now" type="tel" value="+1 (214) 555-01" autocomplete="tel"><span class="m" style="font-weight: 500; font-size: 13px">We text a 6-digit code to confirm this number. Your pro calls you through a private Proven line.</span></label>
</div>
<div style="padding: 14px 24px 26px 24px">
<a class="btn sun" href="customer-location.html">Continue</a>
</div>
</div>

</body>
</html>
