<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<meta name="robots" content="noindex">
<title>Proven prototype: Request car detailing</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#35204F}a:hover{color:#1E1030}
.scr{width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#F5F2F8;color:#35204F;font-family:Figtree,system-ui,sans-serif;font-size:15px;line-height:1.4}
.h{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.025em;line-height:1.04;margin:0}
.m{color:#5E5270}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;box-sizing:border-box;border:0;border-radius:18px;font:700 17px Figtree,sans-serif;text-decoration:none}
.sun{background:#FFC233;color:#35204F;box-shadow:0 5px 0 #D99A0B}
.back{width:44px;height:44px;margin-left:-10px;display:flex;align-items:center;justify-content:center;color:#35204F}
.lb{font-weight:700;font-size:14px}
.opt{min-height:48px;border-radius:16px;border:2px solid #DDD3E8;background:#fff;color:#35204F;font:600 14.5px Figtree,sans-serif}
.opt.on{border-color:#35204F;background:#FFE7A3}
.pk{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:64px;padding:8px 16px;box-sizing:border-box;border-radius:18px;border:2px solid #DDD3E8;background:#fff;color:#35204F;font-family:Figtree,sans-serif;text-align:left}
.pk.on{border-color:#35204F;background:#FFE7A3}
.pk b{display:block;font-size:15px}
.pk small{font-size:13px;color:#5E5270}
.pk.on small{color:#4A3D5C}
</style>
<style>html{background:#1B0E2B}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start}</style>
</head>
<body>
<div class="scr">
<div style="padding: 10px 24px 0 24px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1">
<div style="display: flex; align-items: center; gap: 6px">
<a class="back" href="customer-home.html" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 class="h" style="font-size: 28px">Car detailing</h1>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="lb">Your vehicle</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button class="opt">Sedan</button>
<button class="opt on" aria-pressed="true">SUV</button>
<button class="opt">Truck or van</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="lb">What should we do?</span>
<button class="pk"><span><b>Exterior wash</b><small>Hand wash, wheels and windows</small></span><b>$59</b></button>
<button class="pk on" aria-pressed="true"><span><b>Full detail</b><small>Inside and out, seats, mats, wax</small></span><b>$189</b></button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="lb">Which day works?</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button class="opt">Tue, Nov 24</button>
<button class="opt on" aria-pressed="true">Wed, Nov 25</button>
<button class="opt">Thu, Nov 26</button>
</div>
</div>
<label style="display: flex; flex-direction: column; gap: 8px">
<span class="lb">Message for the pro</span>
<textarea rows="2" style="padding: 12px 16px; box-sizing: border-box; border: 2px solid #DDD3E8; border-radius: 16px; background: #fff; font: 500 15px/1.4 Figtree, sans-serif; color: #35204F; resize: none">Black SUV in the driveway. Water tap is on the left side of the garage.</textarea>
</label>
<p class="m" style="margin: 0; font-size: 13.5px">We send this to proven pros near 4821 Elm Ridge Dr. The first one to accept calls you within 24 hours to set the time.</p>
</div>
<div style="padding: 14px 24px 26px 24px; background: #fff; border-radius: 26px 26px 0 0; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<div>
<div class="h" style="font-size: 30px">$189</div>
<div class="m" style="font-size: 13px">You pay after the job</div>
</div>
<a class="btn sun" href="customer-matching.html">Send request</a>
</div>
</div>

</body>
</html>
